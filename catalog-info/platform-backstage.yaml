apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: developer-portal
  description: The Internal Developer Platform — Backstage instance that provides self-service software templates, catalog management, and GitOps integration.
  annotations:
    github.com/project-slug: tomwire/developer-portal
    argocd/app-name: backstage-idp-dev
    backstage.io/techdocs-ref: dir:.
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: developer-infrastructure
  providesApis:
    - backstage-api

---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
  description: The platform engineering team that maintains the Internal Developer Platform.
spec:
  type: team
  members: [tomwire]
  children: []

---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: developer-infrastructure
  description: Core platform infrastructure running on AWS EKS, including the Backstage portal, ArgoCD GitOps, and shared Terraform modules.
spec:
  owner: platform-team
