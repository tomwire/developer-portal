# =============================================================================
# Go Service Software Template
# =============================================================================

apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: go-service
  title: Go Microservice
  description: Create a new production-ready Go microservice with gRPC, protobuf, Dockerfile, K8s manifests, Terraform module, and full CI/CD pipeline.
  tags: [go, grpc, protobuf, microservice]

spec:
  owner: platform-team
  type: service

  parameters:
    - title: Provide basic information
      required: [serviceName, description, owner, port, apiPath]
      properties:
        serviceName:
          title: Service Name
          type: string
          description: Unique name for your Go service
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
        description:
          title: Description
          type: string
        owner:
          title: Owner
          type: string
        port:
          title: gRPC Port Number
          type: integer
          default: 50051
        apiPath:
          title: Protobuf Package Path
          type: string
          default: "service.v1"

    - title: Choose features
      required: []
      properties:
        includeDocker:
          title: Dockerfile (Multi-stage, distroless)
          type: boolean
          default: true
        includeTerraform:
          title: Terraform Module
          type: boolean
          default: true

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./templates/go-service
        values:
          serviceName: ${{ parameters.serviceName }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          port: ${{ parameters.port }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        allowedHosts: ['github.com']
        repoUrl: github.com?owner=tomwire&repo=${{ parameters.serviceName }}

    - id: register
      name: Register Service in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: 'catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in Catalog
        to: ${{ steps.register.output.catalogRef }}
