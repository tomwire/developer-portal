# =============================================================================
# Terraform Module Software Template
# =============================================================================

apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: terraform-module
  title: Terraform Infrastructure Module
  description: Create a reusable Terraform module for cloud infrastructure (AWS/EKS/GCP). Follows HashiCorp best practices with automated testing.
  tags: [terraform, infra, aws, module]

spec:
  owner: platform-team
  type: library

  parameters:
    - title: Module details
      required: [moduleName, description, cloudProvider]
      properties:
        moduleName:
          title: Module Name
          type: string
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
        description:
          title: Description
          type: string
        cloudProvider:
          title: Cloud Provider
          type: string
          enum: [aws, gcp, azure]
          default: aws

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./templates/terraform-module
        values:
          moduleName: ${{ parameters.moduleName }}
          description: ${{ parameters.description }}
          cloudProvider: ${{ parameters.cloudProvider }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        allowedHosts: ['github.com']
        repoUrl: github.com?owner=tomwire&repo=${{ parameters.moduleName }}

    - id: register
      name: Register Module in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: 'catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
