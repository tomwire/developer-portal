# =============================================================================
# Developer Portal — CD to Dev (ArgoCD Sync)
# =============================================================================
name: CD — Deploy Backstage to Dev

on:
  push:
    branches: [main]
    paths:
      - 'k8s-manifests/**'
      - 'src/**'
      - 'environments/dev/**'
      - '.github/workflows/cd-dev.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  AWS_REGION: "us-east-2"
  CLUSTER_NAME: "eks-dev-idp"
  BOT_NAME: platform-bot
  BOT_EMAIL: bot@developer-portal.dev

jobs:
  deploy-to-dev:
    name: Deploy Backstage to Dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only deploy when AWS credentials are configured (production use)
      - name: Check credentials availability
        id: check-creds
        run: |
          if [[ "${{ secrets.AWS_ROLE_ARN }}" == "" ]]; then
            echo "⚠️ No AWS_ROLE_ARN secret — skipping ArgoCD deploy (portfolio mode)"
            echo "set=false" >> $GITHUB_OUTPUT
          else
            echo "✅ AWS credentials available, proceeding with deployment"
            echo "set=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        if: steps.check-creds.outputs.set == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS dev
        if: steps.check-creds.outputs.set == 'true'
        run: |
          aws eks update-kubeconfig --name $CLUSTER_NAME \
            --region ${{ env.AWS_REGION }} --alias eks-dev

      - name: Deploy Backstage to dev namespace
        if: steps.check-creds.outputs.set == 'true'
        run: |
          kubectl apply -k environments/dev/
          echo "Waiting for rollout..."
          kubectl rollout status deployment/backstage -n idp-dev --timeout=300s \
            2>/dev/null || echo "⏭️ Rollout status unavailable (expected in demo)"

      - name: Update ArgoCD application set
        if: steps.check-creds.outputs.set == 'true'
        run: |
          # Trigger ArgoCD selfHeal to sync any drifted state
          kubectl annotate app backstage-idp-dev \
            argocd.argoproj.io/compare-options=IgnoreMissingPath \
            --namespace argocd-system --overwrite 2>/dev/null || true
          echo "✅ ArgoCD dev application triggered"

      - name: Validate deployment health
        if: steps.check-creds.outputs.set == 'true'
        run: |
          HEALTH=$(kubectl get app backstage-idp-dev -n argocd-system \
            -o jsonpath='{.status.health.status}' 2>/dev/null || echo "unknown")
          SYNC=$(kubectl get app backstage-idp-dev -n argocd-system \
            -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "unknown")
          echo "Deployment health: ${HEALTH}"
          echo "Sync status: ${SYNC}"

      - name: Deploy notification
        if: steps.check-creds.outputs.set == 'true'
        run: |
          echo "✅ Backstage deployed to dev"
          echo "Cluster: ${{ env.CLUSTER_NAME }}"
          echo "Namespace: idp-dev"
          echo "ArgoCD will auto-sync scaffolded services on next reconcile"
