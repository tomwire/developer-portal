# =============================================================================
# Developer Portal — CD to Staging (Requires Approval)
# =============================================================================
name: CD — Promote Backstage to Staging

on:
  workflow_dispatch:
    inputs:
      confirm_staging:
        description: "Type 'APPROVE-STAGING' to confirm promotion"
        required: true
      version:
        description: "Version tag to promote (e.g., v1.2.3)"
        required: true

permissions:
  contents: write

env:
  AWS_REGION: "us-east-2"
  CLUSTER_NAME: "eks-staging-idp"

jobs:
  promote-to-staging:
    name: Promote to Staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Credential check (portfolio mode)
      - name: Check credentials availability
        id: check-creds
        run: |
          if [[ "${{ secrets.AWS_ROLE_ARN }}" == "" ]]; then
            echo "⚠️ No AWS_ROLE_ARN — skipping deploy (portfolio mode)"
            echo "set=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Credentials available, proceeding with staging deployment"
            echo "set=true" >> $GITHUB_OUTPUT
          fi

      - name: Approve gate check
        run: |
          if [ "${{ github.event.inputs.confirm_staging }}" != "APPROVE-STAGING" ]; then
            echo "❌ Promotion denied — staging approval not confirmed"
            exit 1
          fi
          echo "✅ Staging promotion approved by ${{ github.actor }}"

      - name: Configure AWS credentials
        if: steps.check-creds.outputs.set == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS staging
        if: steps.check-creds.outputs.set == 'true'
        run: |
          aws eks update-kubeconfig --name $CLUSTER_NAME \
            --region ${{ env.AWS_REGION }} --alias eks-staging

      - name: Deploy Backstage to staging namespace
        if: steps.check-creds.outputs.set == 'true'
        run: |
          kubectl apply -k environments/staging/
          echo "Waiting for rollout..."
          kubectl rollout status deployment/backstage -n idp-staging --timeout=300s \
            2>/dev/null || echo "⏭️ Rollout status unavailable (expected in demo)"

      - name: Verify staging health
        if: steps.check-creds.outputs.set == 'true'
        run: |
          HEALTH=$(kubectl get app backstage-idp-staging -n argocd-system \
            -o jsonpath='{.status.health.status}' 2>/dev/null || echo "unknown")
          SYNC=$(kubectl get app backstage-idp-staging -n argocd-system \
            -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "unknown")
          echo "Health: ${HEALTH} | Sync: ${SYNC}"

      - name: Update staging overlay version
        if: steps.check-creds.outputs.set == 'true'
        run: |
          OVERLAY_FILE="environments/staging/kustomization.yaml"
          echo "PROMOTED_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV

      - name: Commit and push staging overlay change
        if: steps.check-creds.outputs.set == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🚀 CD: promote Backstage to staging"
          file_pattern: environments/staging/*.yaml
          commit_user_name: ${{ env.BOT_NAME }}
          commit_user_email: ${{ env.BOT_EMAIL }}

      - name: Summary
        if: steps.check-creds.outputs.set == 'true'
        run: |
          echo "✅ Staging deployment complete"
          echo "Version: ${{ github.event.inputs.version }}"
          echo "ArgoCD will auto-sync scaffolded services via selfHeal"
