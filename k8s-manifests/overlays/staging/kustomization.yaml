# Staging overlay — 2 replicas, production-like resources
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: idp-staging

commonLabels:
  environment: staging

replicas:
  - name: backstage
    count: 2

patches:
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backstage
      spec:
        template:
          spec:
            containers:
              - name: backstage
                resources:
                  requests:
                    cpu: "250m"
                    memory: "512Mi"
                  limits:
                    cpu: "1000m"
                    memory: "2Gi"
    target:
      kind: Deployment
      name: backstage

  # Staging-specific image tag override
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backstage
      spec:
        template:
          spec:
            containers:
              - name: backstage
                image: public.ecr.aws/tomwire/developer-portal:${{ STAGING_IMAGE_TAG | default 'staging' }}
    target:
      kind: Deployment
      name: backstage
