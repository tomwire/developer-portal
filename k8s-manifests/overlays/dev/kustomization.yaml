# Development overlay — minimal resources, auto-heal enabled
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: idp-dev

commonLabels:
  environment: dev

replicas:
  - name: backstage
    count: 1

patches:
  # Development-specific resource requests (smaller)
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backstage
      spec:
        template:
          spec:
            containers:
              - name: backstage
                resources:
                  requests:
                    cpu: "100m"
                    memory: "256Mi"
                  limits:
                    cpu: "500m"
                    memory: "1Gi"
    target:
      kind: Deployment
      name: backstage
