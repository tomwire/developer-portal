# =============================================================================
# Developer Portal — Kubernetes Base Manifests
# =============================================================================
# These are the base Kustomize resources for the Backstage application.
# Environment-specific overrides (replicas, resources, etc.) live in overlays/.
# =============================================================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: idp-dev
  labels:
    app.kubernetes.io/name: backstage
    app.kubernetes.io/part-of: developer-portal
    environment: dev

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: idp-dev
  labels:
    app.kubernetes.io/name: backstage
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: developer-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backstage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage
    spec:
      containers:
        - name: backstage
          image: public.ecr.aws/tomwire/developer-portal:latest
          ports:
            - containerPort: 7007
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 7007
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 7007
            initialDelaySeconds: 10
            periodSeconds: 5
          envFrom:
            - configMapRef:
                name: backstage-config

---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: idp-dev
  labels:
    app.kubernetes.io/name: backstage
spec:
  type: ClusterIP
  ports:
    - port: 7007
      targetPort: 7007
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: backstage

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backstage
  namespace: idp-dev
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: "${{ BACKSTAGE_HOSTNAME | default 'backstage.dev.local' }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backstage
                port:
                  number: 7007
